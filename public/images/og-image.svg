      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
