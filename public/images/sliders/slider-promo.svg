    <text x="250" y="210" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">BUNGA KREDIT</text>
    <text x="250" y="235" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#94A3B8" text-anchor="middle">TENOR HINGGA 5 TAHUN</text>

